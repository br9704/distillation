name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Apple silicon, deliberately. `mlx` is a Metal library with no Linux wheel, so a
    # ubuntu runner cannot even resolve this project's dependency set. Running CI on the
    # architecture the project targets is the honest configuration, not a convenience.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the pinned environment
        # Python 3.12 is pinned in pyproject.toml — the ML wheels do not exist for 3.14.
        run: uv sync --all-extras --dev

      - name: Tests
        run: uv run pytest -q

      - name: Assert the reserved amber never reaches a chart
        # CLAUDE.md reserves #FF9500 for collision alerts in the inherited design system.
        # src/charts.py names the token so the constraint is documented; this check makes
        # sure naming it is the only thing that ever happens to it.
        run: |
          if grep -rn --include='*.py' -i 'ff9500' src/ | grep -viE 'RESERVED|Never used|accent-alert|ACCENT_AMBER'; then
            echo "::error::reserved amber #FF9500 used outside its named constant"
            exit 1
          fi
          echo "ok — amber is named, never used"
